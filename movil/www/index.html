<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>COMBOY VID ERP</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #0b1530; color: #e6edf7;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  .caja { padding: 28px 22px; max-width: 360px; }
  img { width: 88px; height: 88px; object-fit: contain; }
  h1 { font-size: 19px; margin: 10px 0 6px; }
  p { color: #b8c6dc; margin: 6px 0; }
  button { margin-top: 18px; padding: 12px 26px; border: 0; border-radius: 12px; background: #1e6bff; color: #fff; font-weight: 600; font-size: 15px; }
</style>
</head>
<body>
<div class="caja">
  <img src="logo.png" alt="" />
  <h1>Sin conexión</h1>
  <p>La primera vez la app necesita internet para guardar el ERP en el celular.</p>
  <p>Después funciona sin señal y sube los cambios sola.</p>
  <button onclick="location.href='https://sistemacomboy.vercel.app/'">Reintentar</button>
</div>
<script>
  // Reintenta solo cuando vuelve la señal
  window.addEventListener("online", function () { location.href = "https://sistemacomboy.vercel.app/"; });
</script>
</body>
</html>
