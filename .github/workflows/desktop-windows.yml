# Compila la app de escritorio (carpeta desktop/) en Windows y deja el
# instalador y el portable como artefacto descargable de la ejecución.
name: App de escritorio Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop-windows.yml"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: COMBOY-VID-ERP-Windows
          path: desktop/dist/*.exe
