<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'; connect-src https:">
<title>Sin conexión · COMBOY VID</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #1f3a5f; color: #fff;
    font-family: "Times New Roman", Times, serif;
  }
  .caja { text-align: center; max-width: 520px; padding: 24px; }
  img { width: 140px; height: 140px; opacity: .95; }
  h1 { font-size: 40px; margin: 18px 0 8px; letter-spacing: .5px; }
  p { font-size: 19px; line-height: 1.45; color: #d6e0ee; margin: 0 0 26px; }
  button {
    font: inherit; font-size: 18px; cursor: pointer;
    background: #b71c1c; color: #fff; border: 0; border-radius: 8px;
    padding: 12px 34px;
  }
  button:disabled { opacity: .6; cursor: default; }
  small { display: block; margin-top: 18px; font-size: 15px; color: #a9b8cc; }
</style>
</head>
<body>
  <div class="caja">
    <img src="logo.png" alt="COMBOY VID">
    <h1>Sin conexión</h1>
    <p>No se pudo conectar con el sistema COMBOY VID.<br>Revisa tu conexión a internet.</p>
    <button id="reintentar">Reintentar</button>
    <small id="estado">Reintentando automáticamente…</small>
  </div>
<script>
  const destino = new URLSearchParams(location.search).get("url") || "https://sistemacomboy.vercel.app";
  const boton = document.getElementById("reintentar");
  const estado = document.getElementById("estado");
  let probando = false;

  async function probar() {
    if (probando) return;
    probando = true;
    boton.disabled = true;
    estado.textContent = "Conectando…";
    try {
      await fetch(destino, { mode: "no-cors", cache: "no-store" });
      location.replace(destino);
      return;
    } catch {
      estado.textContent = "Sin internet. Se reintentará en unos segundos.";
    }
    probando = false;
    boton.disabled = false;
  }

  boton.addEventListener("click", probar);
  window.addEventListener("online", probar);
  setInterval(probar, 10000);
</script>
</body>
</html>
